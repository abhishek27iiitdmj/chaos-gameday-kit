[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-gameday-kit"
version = "0.1.0"
description = "Reproducible chaos experiments for Kubernetes with measured recovery time (RTO)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gameday = "gameday.cli:main"

[tool.setuptools]
packages = ["gameday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
